<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow API 调试控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d0f17 0%, #151828 100%);
      --panel-bg: rgba(26, 29, 46, 0.65);
      --border-color: rgba(255, 255, 255, 0.07);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --success-color: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --warning-color: #f59e0b;
      --error-color: #ef4444;
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 900px) {
      .container {
        grid-template-columns: 550px 1fr;
      }
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a5b4fc, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      box-shadow: 0 0 8px currentColor;
    }

    .status-idle { color: var(--text-secondary); }
    .status-idle .dot { background: var(--text-secondary); }
    
    .status-running { 
      color: var(--warning-color); 
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.1);
    }
    .status-running .dot { 
      background: var(--warning-color); 
      animation: pulse 1.5s infinite alternate;
    }

    .status-success { 
      color: var(--success-color); 
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
    }
    .status-success .dot { background: var(--success-color); }

    .status-error { 
      color: var(--error-color); 
      border-color: rgba(239, 68, 68, 0.3);
    }
    .status-error .dot { background: var(--error-color); }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
      border-left: 4px solid var(--accent-color);
      padding-left: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    input, textarea, select {
      background: rgba(13, 15, 23, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .upload-zone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .upload-zone:hover {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.05);
    }

    .upload-zone p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .upload-preview {
      max-height: 120px;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 0.5rem;
      display: none;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-submit {
      background: linear-gradient(90deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
      background: linear-gradient(90deg, #818cf8, #6366f1);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .console-panel {
      font-family: var(--font-mono);
      background: #080a11;
      border-radius: 14px;
      padding: 1rem;
      height: 350px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .log-line {
      line-height: 1.5;
      word-break: break-all;
    }

    .log-info { color: #818cf8; }
    .log-success { color: var(--success-color); }
    .log-warning { color: var(--warning-color); }
    .log-error { color: var(--error-color); }
    .log-time { color: #4b5563; margin-right: 0.5rem; }

    .output-card {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      gap: 1rem;
    }

    .output-media {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .empty-output-icon {
      width: 48px;
      height: 48px;
      color: rgba(255,255,255,0.15);
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 100px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Workflow API 调试控制台</h1>
      <div id="statusBadge" class="status-badge status-idle">
        <span class="dot"></span>
        <span id="statusText">闲置</span>
      </div>
    </header>

    <div class="panel">
      <div class="panel-title">请求配置</div>
      
      <div class="form-group">
        <label for="apiUrl">接口网关地址 (Base URL)</label>
        <input type="text" id="apiUrl" value="https://uu316886-77936903aee0.westd.seetacloud.com:8443">
      </div>

      <div class="form-group">
        <label for="workflowId">工作流 ID</label>
        <input type="text" id="workflowId" value="H17-文图生视频-LTX2.3全面优化版">
      </div>

      <div class="form-group">
        <label>1. 上传本地输入图像 (转为 Base64)</label>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload-cloud"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path><polyline points="16 16 12 12 8 16"></polyline></svg>
          <p id="uploadPrompt">点击或拖拽图片到此处上传</p>
          <img id="imagePreview" class="upload-preview" alt="Preview">
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageFile(this)">
      </div>

      <div class="form-group">
        <label for="inputImageUrl">或直接输入远程图片 URL</label>
        <input type="text" id="inputImageUrl" placeholder="https://example.com/inputs/remote_image.png">
      </div>

      <div class="form-group">
        <label for="inputText">2. 输入提示词 (Prompt Text)</label>
        <textarea id="inputText" rows="3" placeholder="输入提示词内容..."></textarea>
      </div>

      <div class="input-row">
        <div class="form-group">
          <label for="width">分辨率 Width</label>
          <input type="number" id="width" value="720">
        </div>
        <div class="form-group">
          <label for="height">分辨率 Height</label>
          <input type="number" id="height" value="1280">
        </div>
      </div>

      <button id="submitBtn" class="btn-submit" onclick="startWorkflow()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>执行工作流</span>
      </button>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>执行状态 & 结果</span>
        <span id="progressPercent" style="font-size: 0.9rem; font-weight: normal; color: var(--text-secondary);"></span>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="console-panel" id="consoleLogs">
        <div class="log-line log-info"><span class="log-time">[系统]</span>控制台就绪。请配置参数并点击“执行工作流”按钮。</div>
      </div>

      <div class="output-card" id="outputCard">
        <svg class="empty-output-icon" id="emptyIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <span id="outputPlaceholder" style="color: var(--text-secondary); font-size: 0.9rem;">等待结果视频或图像生成...</span>
      </div>
    </div>
  </div>

  <script>
    let base64Image = '';

    document.getElementById('inputText').value = 'the man saying "Our marriage is void. Pack your things and leave."';

    function handleImageFile(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const preview = document.getElementById('imagePreview');
        preview.src = base64Image;
        preview.style.display = 'block';
        document.getElementById('uploadPrompt').innerText = file.name;
        log('info', `已成功加载并编码本地图片: ${file.name}`);
      };
      reader.readAsDataURL(file);
    }

    function log(type, message) {
      const logs = document.getElementById('consoleLogs');
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      
      const timeSpan = document.createElement('span');
      timeSpan.className = 'log-time';
      timeSpan.innerText = `[${new Date().toLocaleTimeString()}]`;
      
      const textSpan = document.createElement('span');
      textSpan.innerText = message;
      
      line.appendChild(timeSpan);
      line.appendChild(textSpan);
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
    }

    function updateStatus(state, text) {
      const badge = document.getElementById('statusBadge');
      badge.className = `status-badge status-${state}`;
      document.getElementById('statusText').innerText = text;
    }

    async function startWorkflow() {
      const submitBtn = document.getElementById('submitBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      
      const baseUrl = document.getElementById('apiUrl').value.trim();
      const workflowId = document.getElementById('workflowId').value.trim();
      const text = document.getElementById('inputText').value.trim();
      const inputUrl = document.getElementById('inputImageUrl').value.trim();
      const width = parseInt(document.getElementById('width').value, 10);
      const height = parseInt(document.getElementById('height').value, 10);

      const finalImage = base64Image || inputUrl;

      if (!finalImage) {
        alert('请至少上传一张本地图片或指定远程图片 URL！');
        return;
      }

      submitBtn.disabled = true;
      progressContainer.style.display = 'block';
      progressBar.style.width = '5%';
      progressPercent.innerText = '正在启动...';
      
      const outputCard = document.getElementById('outputCard');
      outputCard.innerHTML = `
        <svg class="empty-output-icon" id="emptyIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <span id="outputPlaceholder" style="color: var(--text-secondary); font-size: 0.9rem;">正在向后台发送请求...</span>
      `;

      updateStatus('running', '正在提交');
      log('info', '开始发送接口请求...');
      log('info', `Workflow ID: ${workflowId}`);

      try {
        const payload = {
          workflow_id: workflowId,
          input_values: {
            "2004:image": finalImage,
            "5013:text": text,
            "5018:value": width,
            "5020:value": height
          }
        };

        const response = await fetch(`${baseUrl}/api/workflow/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`接口响应错误: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        log('success', `工作流创建成功! Prompt ID: ${data.prompt_id}`);
        
        progressBar.style.width = '15%';
        progressPercent.innerText = '正在排队/处理...';

        const promptId = data.prompt_id;
        if (!promptId) {
          throw new Error('未返回有效的 prompt_id');
        }

        await pollWorkflowResult(baseUrl, promptId);

      } catch (error) {
        log('error', `请求失败: ${error.message}`);
        updateStatus('error', '失败');
        submitBtn.disabled = false;
        progressContainer.style.display = 'none';
        progressPercent.innerText = '';
        document.getElementById('outputPlaceholder').innerText = `生成失败: ${error.message}`;
      }
    }

    async function pollWorkflowResult(baseUrl, promptId) {
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const submitBtn = document.getElementById('submitBtn');
      
      const pollInterval = 4000;
      let finished = false;
      let checkCount = 0;

      while (!finished) {
        checkCount++;
        log('info', `[第 ${checkCount} 次轮询] 正在获取任务结果...`);
        
        try {
          const res = await fetch(`${baseUrl}/api/workflow/result?prompt_id=${promptId}`);
          if (!res.ok) {
            log('warning', `轮询请求 HTTP 异常: ${res.status}`);
            await new Promise(resolve => setTimeout(resolve, pollInterval));
            continue;
          }

          const result = await res.json();
          
          if (result.pending === false) {
            if (result.success === false || result.error) {
              log('error', `后台任务提示失败: ${result.error || '未知错误'}`);
              throw new Error(result.error || '任务处理失败');
            }

            log('success', '工作流运行完成！已获取到简化结果数据。');
            log('info', `结果详情: ${JSON.stringify(result)}`);
            
            progressBar.style.width = '100%';
            progressPercent.innerText = '运行成功';
            updateStatus('success', '已完成');
            finished = true;

            renderOutput(result, baseUrl);
            break;
          } else {
            let currentWidth = parseInt(progressBar.style.width, 10) || 15;
            if (currentWidth < 90) {
              progressBar.style.width = `${currentWidth + 5}%`;
            }
            progressPercent.innerText = `处理中 (${currentWidth}%)`;
          }

        } catch (err) {
          log('error', `轮询过程中发生异常: ${err.message}`);
          if (checkCount > 50) {
            throw new Error('轮询超时，已自动停止。');
          }
        }

        await new Promise(resolve => setTimeout(resolve, pollInterval));
      }

      submitBtn.disabled = false;
    }

    function renderOutput(result, baseUrl) {
      const outputCard = document.getElementById('outputCard');
      outputCard.innerHTML = '';

      if (!result.results || result.results.length === 0) {
        outputCard.innerHTML = `
          <div style="width: 100%; text-align: left;">
            <p style="margin-bottom: 0.5rem; color: var(--success-color); font-weight: 500;">任务完成，但 results 数组为空，返回数据如下：</p>
            <pre style="background: rgba(0,0,0,0.4); padding: 1rem; border-radius: 8px; font-family: var(--font-mono); font-size: 0.8rem; overflow: auto; max-height: 300px;">${JSON.stringify(result, null, 2)}</pre>
          </div>
        `;
        return;
      }

      log('success', `解析到 ${result.results.length} 个媒体输出。`);

      const container = document.createElement('div');
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.gap = '1.5rem';
      container.style.width = '100%';

      result.results.forEach((item, index) => {
        const absoluteUrl = baseUrl + item.url;
        log('success', `输出 #${index + 1} (${item.type}): ${absoluteUrl}`);

        const itemDiv = document.createElement('div');
        itemDiv.className = 'result-item';
        itemDiv.style.display = 'flex';
        itemDiv.style.flexDirection = 'column';
        itemDiv.style.alignItems = 'center';
        itemDiv.style.gap = '0.5rem';
        itemDiv.style.width = '100%';
        if (index < result.results.length - 1) {
          itemDiv.style.borderBottom = '1px solid var(--border-color)';
          itemDiv.style.paddingBottom = '1.5rem';
        }

        const title = document.createElement('p');
        title.style.color = 'var(--success-color)';
        title.style.fontWeight = '600';
        title.style.fontSize = '0.95rem';
        title.innerText = `生成结果 #${index + 1} (${item.type === 'video' ? '视频' : '图像'}/${item.filename})`;
        itemDiv.appendChild(title);

        if (item.type === 'video' || item.filename.match(/\.(mp4|webm|ogg|mov|gif)/i)) {
          const video = document.createElement('video');
          video.className = 'output-media';
          video.src = absoluteUrl;
          video.controls = true;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.style.maxWidth = '100%';
          video.style.maxHeight = '400px';
          video.style.borderRadius = '8px';
          video.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
          itemDiv.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.className = 'output-media';
          img.src = absoluteUrl;
          img.alt = item.filename;
          img.style.maxWidth = '100%';
          img.style.maxHeight = '400px';
          img.style.borderRadius = '8px';
          img.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
          itemDiv.appendChild(img);
        }

        const link = document.createElement('a');
        link.href = absoluteUrl;
        link.target = '_blank';
        link.style.color = 'var(--accent-color)';
        link.style.fontSize = '0.85rem';
        link.style.textDecoration = 'none';
        link.style.marginTop = '0.5rem';
        link.innerText = '在新窗口打开原始文件';
        itemDiv.appendChild(link);

        container.appendChild(itemDiv);
      });

      outputCard.appendChild(container);
    }
  </script>
</body>
</html>
